<section class="menu-header">
  <canvas id="menuCanvas" class="menu-canvas"></canvas>
  <div class="menu-header-content">
    <h1>🧪 Playground</h1>
    <p>Tulis HTML, CSS, JavaScript. Lihat hasilnya langsung!</p>
  </div>
</section>

<section class="playground-section">
  <div class="playground-grid">
    <div class="pg-editor">
      <div class="pg-tabs">
        <button class="pg-tab active" onclick="switchTab('html', this)">HTML</button>
        <button class="pg-tab" onclick="switchTab('css', this)">CSS</button>
        <button class="pg-tab" onclick="switchTab('js', this)">JS</button>
      </div>
      <textarea id="pgHtml" class="pg-code" placeholder="<!-- HTML -->"></textarea>
      <textarea id="pgCss" class="pg-code" placeholder="/* CSS */" style="display:none"></textarea>
      <textarea id="pgJs" class="pg-code" placeholder="// JavaScript" style="display:none"></textarea>
      <div class="pg-actions">
        <button class="btn btn-primary" onclick="runPlayground()">▶️ Run</button>
        <button class="btn btn-secondary" onclick="clearPlayground()">🗑️ Clear</button>
      </div>
    </div>
    <div class="pg-preview">
      <div class="pg-preview-head">Preview</div>
      <iframe id="pgFrame" class="pg-frame"></iframe>
    </div>
  </div>
</section>
