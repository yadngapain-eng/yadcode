<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <span class="logo-svg">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect x="2" y="2" width="30" height="30" rx="8" stroke="#00e5ff" stroke-width="2"/>
        <path d="M10 12 L6 17 L10 22" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 12 L28 17 L24 22" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 9 L15 25" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-name">YADCODE</span>
  </a>
  <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="index.html">🏠 Home</a>
    <a href="menu.html">📚 Materi</a>
    <a href="playground.html" class="active">🧪 Playground</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a href="credit.html">💎 Credit</a>
  </div>
</nav>

<section class="playground-section">
  <h2 class="section-title">🧪 <span class="gradient-text">Live Playground</span></h2>
  <p style="text-align:center;color:var(--text-muted);margin-bottom:32px">
    Tulis HTML, CSS, dan JavaScript — lihat hasilnya secara real-time.
  </p>

  <div class="playground-grid">
    <div class="pg-editor">
      <div class="pg-tabs">
        <button class="pg-tab active" data-tab="html">HTML</button>
        <button class="pg-tab" data-tab="css">CSS</button>
        <button class="pg-tab" data-tab="js">JS</button>
      </div>
      <textarea class="pg-code" id="pgHtml" spellcheck="false">&lt;h1&gt;Halo YADCODE! 👋&lt;/h1&gt;
&lt;p&gt;Coba edit kode ini dan lihat hasilnya.&lt;/p&gt;
&lt;button onclick="sapa()"&gt;Klik Aku!&lt;/button&gt;</textarea>
      <textarea class="pg-code" id="pgCss" spellcheck="false" style="display:none">body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #060918, #0d1228);
  color: #e8ecff;
  text-align: center;
  padding: 60px 20px;
}
h1 {
  background: linear-gradient(90deg, #00e5ff, #7c4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 42px;
}
button {
  padding: 14px 32px;
  background: linear-gradient(135deg, #00e5ff, #0072ff);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 20px;
}</textarea>
      <textarea class="pg-code" id="pgJs" spellcheck="false" style="display:none">function sapa() {
  alert('Halo dari YADCODE! 🚀');
  console.log('Button diklik!');
}</textarea>
      <div class="pg-actions">
        <button class="btn btn-primary btn-small" onclick="runCode()">▶️ Run</button>
        <button class="btn btn-secondary btn-small" onclick="resetCode()">🔄 Reset</button>
        <button class="btn btn-secondary btn-small" onclick="downloadCode()">💾 Save</button>
      </div>
    </div>

    <div class="pg-preview">
      <div class="pg-preview-head">🖥️ Preview</div>
      <iframe class="pg-frame" id="pgFrame" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </div>
</section>

<footer>
  <p>Made with 💙 by <a href="credit.html">YADCODE Team</a></p>
  <p style="margin-top:8px">© 2025 YADCODE. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<script src="js/bg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
